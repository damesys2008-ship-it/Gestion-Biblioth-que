# Définit le nom logique de l'application Spring.
spring.application.name=bibliotheque-api
# Configure le port du serveur HTTP.
server.port=8080
# Base H2 en mémoire
# Définit l'URL JDBC de la base H2 temporaire.
spring.datasource.url=jdbc:h2:mem:bibliothequedb
# Sélectionne le pilote JDBC H2.
spring.datasource.driver-class-name=org.h2.Driver
# Définit l'utilisateur de connexion H2.
spring.datasource.username=sa
# Laisse le mot de passe vide pour cette base locale de démonstration.
spring.datasource.password=
# Console H2 : http://localhost:8080/h2-console
# Active la console web de la base H2.
spring.h2.console.enabled=true
# Définit le chemin d'accès à la console H2.
spring.h2.console.path=/h2-console
# JPA / Hibernate
# Recrée le schéma à chaque démarrage de l'application.
spring.jpa.hibernate.ddl-auto=create-drop
# Affiche les requêtes SQL exécutées par Hibernate.
spring.jpa.show-sql=true
# Formate les requêtes SQL affichées dans les logs.
spring.jpa.properties.hibernate.format_sql=true
# Exécuter data.sql APRÈS la création des tables
# Diffère le chargement du script jusqu'à la création du schéma JPA.
spring.jpa.defer-datasource-initialization=true
# Swagger UI : http://localhost:8080/swagger-ui.html
# Définit le chemin de l'interface Swagger.
springdoc.swagger-ui.path=/swagger-ui.html